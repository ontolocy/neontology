name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      neo4j:
        # Docker Hub Image
        image: neo4j:2026-community
        # ports to expose
        ports:
          - 7687:7687
          - 7474:7474
        # environment variables
        env:
          NEO4J_AUTH: ${{secrets.TEST_NEO4J_AUTH}}
      testmemgraph:
        image: memgraph/memgraph:latest
        ports:
          - 9687:7687
          - 7444:7444
        env:
          MEMGRAPH_USER: ${{secrets.TEST_MEMGRAPH_USER}}
          MEMGRAPH_PASSWORD: ${{secrets.TEST_MEMGRAPH_PASSWORD}}

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The [rust] extra is dropped on free-threaded builds: neo4j-rust-ext ships no
        # free-threaded wheels, so it falls back to compiling its sdist, where PyO3
        # refuses free-threaded CPython below 3.14 outright and costs minutes of cargo
        # build on 3.14t. It is a drop-in codec for the driver rather than something
        # neontology calls, so the other matrix entries cover it.
        run: |
          uv sync --all-extras ${{ endsWith(matrix.python-version, 't') && '--no-extra rust' || '' }}
      - name: Test default engines with pytest
        env:
          TEST_NEO4J_URI: bolt://localhost:7687
          TEST_NEO4J_USERNAME: neo4j
          TEST_NEO4J_PASSWORD: ${{secrets.TEST_NEO4J_PASSWORD}}
          TEST_MEMGRAPH_URI: bolt://localhost:9687
          TEST_MEMGRAPH_USER: ${{secrets.TEST_MEMGRAPH_USER}}
          TEST_MEMGRAPH_PASSWORD: ${{secrets.TEST_MEMGRAPH_PASSWORD}}
        run: |
          uv run pytest -x --benchmark-disable

  minimal-install:
    # neontology must work without its optional extras - [grand] for the NetworkX
    # engine and [pandas] for dataframe support. No other job exercises that, so a
    # stray top-level import of either would break `pip install neontology` while
    # CI stayed green.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies but no extras
        run: |
          uv sync
      - name: Confirm the optional dependencies really are absent
        # if either ever moves into the dev group this fails loudly, rather than
        # the job quietly stopping testing what it exists to test
        run: |
          uv run python -c "
          import importlib.util, sys
          for module, extra in (('networkx', 'grand'), ('pandas', 'pandas')):
              if importlib.util.find_spec(module):
                  sys.exit(f'{module} is installed - this job must run without the [{extra}] extra')
          print('optional extras absent, as required')
          "
      - name: Confirm neontology imports without it
        run: |
          uv run python -c "import neontology; neontology.BaseNode; print('neontology imports without grand')"
      - name: Test with pytest
        run: |
          uv run pytest -m "not uses_graph" --benchmark-disable

name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      neo4j:
        # Docker Hub Image
        image: neo4j:2026-community
        # ports to expose
        ports:
          - 7687:7687
          - 7474:7474
        # environment variables
        env:
          NEO4J_AUTH: ${{secrets.TEST_NEO4J_AUTH}}
      testmemgraph:
        image: memgraph/memgraph:latest
        ports:
          - 9687:7687
          - 7444:7444
        env:
          MEMGRAPH_USER: ${{secrets.TEST_MEMGRAPH_USER}}
          MEMGRAPH_PASSWORD: ${{secrets.TEST_MEMGRAPH_PASSWORD}}

    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --all-extras
      - name: Test default engines with pytest
        env:
          TEST_NEO4J_URI: bolt://localhost:7687
          TEST_NEO4J_USERNAME: neo4j
          TEST_NEO4J_PASSWORD: ${{secrets.TEST_NEO4J_PASSWORD}}
          TEST_MEMGRAPH_URI: bolt://localhost:9687
          TEST_MEMGRAPH_USER: ${{secrets.TEST_MEMGRAPH_USER}}
          TEST_MEMGRAPH_PASSWORD: ${{secrets.TEST_MEMGRAPH_PASSWORD}}
        run: |
          uv run pytest -x --benchmark-skip

  minimal-install:
    # neontology must work without the optional [grand] extra. No other job
    # exercises that - they all install it - so a stray top-level import of
    # networkx would break `pip install neontology` while CI stayed green.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dev dependencies but no extras
        run: |
          uv sync
      - name: Confirm the optional dependency really is absent
        # if grand ever moves into the dev group this fails loudly, rather than
        # the job quietly stopping testing what it exists to test
        run: |
          uv run python -c "import importlib.util, sys; sys.exit('networkx is installed - this job must run without the [grand] extra') if importlib.util.find_spec('networkx') else print('grand absent, as required')"
      - name: Confirm neontology imports without it
        run: |
          uv run python -c "import neontology; neontology.BaseNode; print('neontology imports without grand')"
      - name: Test with pytest
        run: |
          uv run pytest -m "not uses_graph" --benchmark-skip
